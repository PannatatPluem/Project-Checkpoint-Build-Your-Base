<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Learning Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="container py-4">

    <h1>
        <i class="fa-solid fa-briefcase"></i>
        My Learning Portfolios
        
    </h1>


    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <h3>Create Portfolio</h3>
            <section>
                <form id="portfolio-form">
                    <input class="form-control mb-2" name="name" placeholder="Your Name" required>

                    <textarea class="form-control mb-2" name="whatIEnjoy" placeholder="What I Enjoy"
                        required></textarea>

                    <textarea class="form-control mb-2" name="whatIveTried" placeholder="What I've Tried"
                        required></textarea>

                    <textarea class="form-control mb-2" name="whatImCuriousAbout" placeholder="What I'm Curious About"
                        required></textarea>

                    <button type="submit">
                        <i class="fa-solid fa-user-plus"></i>
                        Create Portfolio
                    </button>

                    <button type="reset" class="btn btn-secondary">
                        Clear Form
                    </button>
                </form>

                <hr>
            </section>
        </div>
        <div class="col-12 col-lg-6">
            <h3>Add Portfolio Item</h3>

            <section>
                <form id="item-form">

                    <select class="form-select mb-2" name="portfolioId" required>
                        <option value="">Select Portfolio</option>
                    </select>

                    <input class="form-control mb-2" name="title" placeholder="Title" required>

                    <input class="form-control mb-2" name="type" placeholder="Type" required>

                    <input class="form-control mb-2" type="date" name="date" required>

                    <input class="form-control mb-2" name="role" placeholder="Role" required>

                    <textarea class="form-control mb-2" name="description" placeholder="Description"
                        required></textarea>

                    <input class="form-control mb-2" name="skills" placeholder="Skills (HTML, CSS, JavaScript)"
                        required>

                    <textarea class="form-control mb-2" name="whatIDid" placeholder="What I did" required></textarea>

                    <textarea class="form-control mb-2" name="whatILearned" placeholder="What I learned"
                        required></textarea>

                    <textarea class="form-control mb-2" name="challenge" placeholder="Challenge" required></textarea>

                    <textarea class="form-control mb-2" name="nextStep" placeholder="Next step" required></textarea>

                    <input class="form-control mb-2" type="url" name="evidence" placeholder="Evidence URL" required>

                    <button type="submit">
                        <i class="fa-solid fa-folder-plus"></i>
                        Add Portfolio Item
                    </button>

                </form>

                <hr>
            </section>
        </div>
    </div>
    </div>


    <h3>Portfolio List</h3>

    <section>
    <div id="portfolio-list"></div>
    </section>


    <script src="js/portfolip.js"></script>

</body>

</html>
